name: Windows Launcher Smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/intel.ps1"
      - "intel.cmd"
      - "intel.py"
      - "intel_console.py"
      - "intel_locales.py"
      - "intel_config.py"
      - "intel_lifecycle.py"
      - "intel_devtools.py"
      - "tests/test_devtools.py"
      - "tests/test_capability_registry.py"
      - "tests/test_lifecycle.py"
      - "tests/test_configuration_setup.py"
      - "tests/test_local_cli.py"
      - "tests/test_terminal_localization.py"
      - "scripts/verify_host_mcp.py"
      - "generators/**"
      - ".github/workflows/windows-launcher.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify localized CLI and terminal rendering on Windows
        shell: pwsh
        run: |
          python -m unittest tests.test_local_cli tests.test_terminal_localization tests.test_configuration_setup tests.test_lifecycle tests.test_capability_registry tests.test_devtools -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:INTEL_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'intel-ui-test'
          $env:NO_COLOR = '1'
          cmd /c "intel.cmd --json doctor"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd setup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd setup --apply"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd stop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd --json status"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd config validate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd config language de"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd help"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd --json doctor full"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd --json clean"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "intel.cmd --json logs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python intel.py --json capabilities | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python intel.py --json providers | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse Windows PowerShell 5.1 launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) 'scripts\intel.ps1'),
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
      - name: Verify automatic desktop key loading with a synthetic key
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $dir = Join-Path $desktop 'tunnel-client'
          $keyFile = Join-Path $dir 'key.txt'
          $profileDir = Join-Path $env:APPDATA 'tunnel-client'
          $profileFile = Join-Path $profileDir 'chatgpt-intelligence.yaml'
          $fakeClient = Join-Path $env:RUNNER_TEMP 'fake-client.cmd'
          New-Item -ItemType Directory -Force -Path $dir, $profileDir | Out-Null
          try {
            Set-Content -LiteralPath $keyFile -Value 'sk-synthetic-test-only-123456789' -Encoding UTF8
            Set-Content -LiteralPath $profileFile -Value 'synthetic: true' -Encoding UTF8
            Set-Content -LiteralPath $fakeClient -Value '@echo off', 'if not defined CONTROL_PLANE_API_KEY exit /b 2', 'exit /b 0' -Encoding ASCII
            Remove-Item Env:\CONTROL_PLANE_API_KEY -ErrorAction SilentlyContinue
            .\scripts\intel.ps1 -Action Doctor -TunnelClient $fakeClient
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if (Test-Path Env:\CONTROL_PLANE_API_KEY) { throw 'Temporary credential was retained.' }
          }
          finally {
            Remove-Item -LiteralPath $keyFile, $profileFile, $fakeClient -Force -ErrorAction SilentlyContinue
          }
      - name: Run launcher MCP smoke action
        shell: powershell
        run: .\scripts\intel.ps1 -Action Test
